# =====================================================================
# Quanthreum (QTH) - Production Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/quanthreum
# Enable: ln -s /etc/nginx/sites-available/quanthreum /etc/nginx/sites-enabled/
# =====================================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Replace with your domain or server IP

    # Redirect all HTTP traffic to HTTPS (uncomment after obtaining SSL cert)
    # return 301 https://$host$request_uri;

    # Gzip compression for fast loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / EventStream support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running block queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# SSL Configuration (Automatically created by Certbot / Let's Encrypt):
# To activate SSL:
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
