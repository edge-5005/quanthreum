<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dribbble NextWare Electric Mint Gradient for Top-Left Facet -->
    <linearGradient id="qth-grad-primary" x1="18" y1="20" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5cf9d0"/>
      <stop offset="60%" stop-color="#4fe0b6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Deep Emerald & Obsidian Shadow Facet -->
    <linearGradient id="qth-grad-secondary" x1="50" y1="18" x2="82" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#80f2ce"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#071912"/>
    </linearGradient>

    <!-- Lower Left Facet: Forest Emerald Depth -->
    <linearGradient id="qth-grad-bot-left" x1="22" y1="52" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Lower Right Facet: Obsidian Void -->
    <linearGradient id="qth-grad-bot-right" x1="50" y1="52" x2="76" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#080d0d"/>
    </linearGradient>

    <!-- Orbital Q-Ring Gradient in Radiant Electric Mint -->
    <linearGradient id="qth-grad-q-ring" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5cf9d0"/>
      <stop offset="40%" stop-color="#4fe0b6"/>
      <stop offset="80%" stop-color="#27e38c"/>
      <stop offset="100%" stop-color="#80f2ce"/>
    </linearGradient>

    <radialGradient id="qth-core-glow" cx="50" cy="46" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#4fe0b6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5cf9d0" stop-opacity="0"/>
    </radialGradient>

    <filter id="qth-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Orbital Quantum 'Q' Ring -->
  <path d="M 50 8 A 42 42 0 1 0 78 78 L 93 93 M 78 78 A 42 42 0 0 0 50 8" 
        stroke="url(#qth-grad-q-ring)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#qth-glow-filter)"/>

  <!-- Orbital Polar Entanglement Nodes -->
  <circle cx="50" cy="8" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="8" r="1.8" fill="#4fe0b6"/>
  <circle cx="93" cy="93" r="4" fill="#ffffff"/>
  <circle cx="93" cy="93" r="2.2" fill="#4fe0b6"/>

  <!-- Top-Left Upper Prism Facet -->
  <polygon points="50,18 24,50 50,44" fill="url(#qth-grad-primary)"/>

  <!-- Top-Right Upper Prism Facet -->
  <polygon points="50,18 50,44 76,50" fill="url(#qth-grad-secondary)"/>

  <!-- Center Ridge Luminescence Line -->
  <line x1="50" y1="18" x2="50" y2="44" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>

  <!-- Lower-Left Prism Facet -->
  <polygon points="50,48 24,54 50,80" fill="url(#qth-grad-bot-left)"/>

  <!-- Lower-Right Prism Facet -->
  <polygon points="50,48 50,80 76,54" fill="url(#qth-grad-bot-right)"/>

  <!-- Center Lower Ridge -->
  <line x1="50" y1="48" x2="50" y2="80" stroke="#80f2ce" stroke-width="1" stroke-linecap="round" opacity="0.75"/>

  <!-- Quantum Core Singularity -->
  <circle cx="50" cy="46" r="4.5" fill="url(#qth-core-glow)"/>
  <circle cx="50" cy="46" r="2.2" fill="#ffffff"/>
</svg>
