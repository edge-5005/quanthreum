<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Quantum Cyan to Deep Azure Gradient for Top-Left Facet -->
    <linearGradient id="qth-grad-primary" x1="18" y1="20" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Deep Indigo & Titanium Slate for Top-Right Shadow Facet -->
    <linearGradient id="qth-grad-secondary" x1="50" y1="18" x2="82" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Lower Left Facet: Oceanic Depth -->
    <linearGradient id="qth-grad-bot-left" x1="22" y1="52" x2="50" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Lower Right Facet: Cyber Twilight -->
    <linearGradient id="qth-grad-bot-right" x1="50" y1="52" x2="76" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Orbital Q-Ring Gradient -->
    <linearGradient id="qth-grad-q-ring" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="85%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="qth-core-glow" cx="50" cy="46" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="qth-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Orbital Quantum 'Q' Ring -->
  <path d="M 50 8 A 42 42 0 1 0 78 78 L 93 93 M 78 78 A 42 42 0 0 0 50 8" 
        stroke="url(#qth-grad-q-ring)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orbital Nodes (Quantum Entangled Qubits) -->
  <circle cx="50" cy="8" r="3.2" fill="#00f5ff" filter="url(#qth-glow-filter)"/>
  <circle cx="8" cy="50" r="2.8" fill="#38bdf8"/>
  <circle cx="93" cy="93" r="3.8" fill="#00f5ff" filter="url(#qth-glow-filter)"/>

  <!-- Ethereum-Quantum Crystalline Octahedron -->
  <!-- Top Left Facet -->
  <polygon points="50,18 24,50 50,44" fill="url(#qth-grad-primary)"/>
  
  <!-- Top Right Facet -->
  <polygon points="50,18 50,44 76,50" fill="url(#qth-grad-secondary)"/>

  <!-- Center Highlight Spine -->
  <line x1="50" y1="18" x2="50" y2="44" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
  <line x1="24" y1="50" x2="50" y2="44" stroke="#38bdf8" stroke-width="0.8" opacity="0.6"/>
  <line x1="76" y1="50" x2="50" y2="44" stroke="#818cf8" stroke-width="0.8" opacity="0.6"/>

  <!-- Bottom Left Facet -->
  <polygon points="50,48 24,54 50,80" fill="url(#qth-grad-bot-left)"/>

  <!-- Bottom Right Facet -->
  <polygon points="50,48 50,80 76,54" fill="url(#qth-grad-bot-right)"/>

  <!-- Central Quantum Singularity / Core -->
  <circle cx="50" cy="46" r="4.5" fill="url(#qth-core-glow)"/>
  <circle cx="50" cy="46" r="1.8" fill="#ffffff"/>
</svg>
